<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>logowanie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div id="logowanie">
            <h1>Login</h1><br>
            <form action="logowanie.html">
                <input type="text" name="login" id="loginInput" placeholder="Login"><br><br>
                <input type="password" name="password" id="passwordInput" placeholder="password"><br><br>
                <input type="submit" value="Potwierdź" id="submitInput">
            </form><br>
            <button class="changeType" type="button">Sign up</button>
        </div>
        <div id="rejestrowanie">
            <h1>Sign-up</h1><br>
            <form action="logowanie.html">
                <input type="text" name="login" id="loginInputRejestrowanie" placeholder="Login"><br><br>
                <input type="password" name="password" id="passwordInputRejestrowanie" placeholder="password"><br><br>
                <input type="password" name="passwordAgain" id="passwordInputAgain" placeholder="type your password again"><br><br>
                <input type="submit" value="Potwierdź" id="submitInputRejestrowanie">
            </form><br>
            <button class="changeType" type="button">Login</button>
        </div>
    </main>
    <script src="jquery-4.0.0.min.js"></script>
    <script src="backgroundLogic.js"></script>
    <script src="passwordLogic.js"></script>
    <script src="script.js"></script>
</body>
</html>
